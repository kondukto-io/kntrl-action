name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and verify bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build bundles
        run: npm run build

      - name: Verify committed bundle matches source
        run: |
          # The action.yml entrypoints reference dist/index.js and
          # stop/dist/index.js — these MUST stay in lockstep with src/.
          # If this step fails: run `npm run build` locally and commit the result.
          if [ -n "$(git status --porcelain dist/ stop/dist/)" ]; then
            echo "::error::Committed dist/ is stale relative to src/."
            echo "Run 'npm run build' and commit the regenerated bundles."
            git --no-pager diff dist/ stop/dist/
            exit 1
          fi
